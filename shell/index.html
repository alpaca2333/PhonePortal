<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- maximum-scale=1 + user-scalable=no: the shell is the TOP-LEVEL document, so it — and only
       it — decides whether the portal page can be zoomed (double-tap-to-zoom / pinch). Sub-apps
       live in an iframe, so their own viewport meta cannot stop the browser from zooming the page
       around them. See the「page zoom lock」note in styles.css and TECHNICAL.md §7. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="description" content="手机本地门户 —— 聚合多个独立子应用" />
  <title>手机门户</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
  <link rel="stylesheet" href="/shell/styles.css" />
</head>
<body>
  <div id="app"></div>
  <noscript>请启用 JavaScript 以使用门户。</noscript>
  <script type="module" src="/shell/main.js"></script>
</body>
</html>
